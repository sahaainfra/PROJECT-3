name: ERP source regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run erp:regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-000-source-regression
          path: docs/erp-program/test-evidence/part-000/runs/
          if-no-files-found: ignore
